<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ave Tenebrae — la carte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='zoom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='carte.css') }}">
</head>
<body>
  <!-- Le serveur passe le tirage et le calage de la grille en JSON ; le JavaScript s'en sert
       pour convertir les coordonnées cubiques en pixels et poser les pions. -->
  <input type="hidden" id="pions" value="{{ pions }}">
  <input type="hidden" id="grille" value="{{ grille }}">
  <input type="hidden" id="phase" value="{{ phase }}">
  <!-- Qui regarde, qui tient quel camp — et le numéro de version de la partie, à quoi le
       navigateur voit que l'adversaire a joué (voir la route « /partie/etat »). -->
  <input type="hidden" id="table" value="{{ table }}">
  <input type="hidden" id="version" value="{{ version }}">

  <div id="cadre">
    <div id="toile">
      <div id="plateau">
        <img id="carte" src="{{ url_for('jeu.image_de_la_carte') }}" alt="Carte d'Ave Tenebrae">
      </div>
    </div>
  </div>

  <!-- Le panneau du coin haut-gauche : la barre d'outils, et sous elle la fiche de l'unité
       survolée. Les deux sont hors de #plateau, ils échappent donc au zoom. -->
  <div id="panneau">
    <div id="outils">
      <button type="button" id="dezoomer" title="Reculer">−</button>
      <span id="echelle">—</span>
      <button type="button" id="zoomer" title="Approcher">+</button>
      <button type="button" id="ajuster">ajuster</button>
      <!-- Ramène au centre de la fenêtre le dernier pion cliqué. Tant qu'on n'a cliqué aucun
           pion, il n'y a rien à viser : le bouton reste éteint. -->
      <button type="button" id="localiser" title="Centrer sur le dernier pion cliqué" disabled>
        localiser
      </button>

      <!-- La phase courante et son avancement, dans le prolongement des boutons de zoom. -->
      <span id="phase-libelle"></span>
      <button type="button" id="phase-suivante">Phase suivante</button>
      <button type="button" id="attaquer" hidden>Attaquer</button>
      <button type="button" id="annuler-combat" hidden>Annuler</button>

      <!-- Le joueur : un seul bouton, quel que soit l'état. Anonyme, il envoie chez Discord ;
           connecté, il ouvre le dialogue de la table. Rien d'autre n'entre dans la barre — sa
           taille de référence est documentée dans carte.css, et un ajout de plus la ferait
           déborder par la droite. -->
      <button type="button" id="joueur"></button>
    </div>

    <!-- Ce que le serveur a refusé — jouer hors de son tour, sans place, sans compte. Sous la
         barre comme la fiche : le panneau grandit vers le bas, la barre ne bouge pas. -->
    <div id="message" hidden></div>

    <!-- La fiche de l'unité survolée, sous la barre plutôt qu'à sa suite : dans la barre, elle
         devait rester minuscule pour ne pas l'allonger. Le JavaScript la remplit avec ce que porte
         le champ caché « pions ». -->
    <div id="fiche" hidden>
      <img id="fiche-image" alt="">
      <div id="fiche-texte">
        <span id="fiche-nom"></span>
        <span id="fiche-appoint"></span>
        <span id="fiche-symbole"></span>
        <dl id="fiche-valeurs"></dl>
        <span id="fiche-remarques"></span>
      </div>
    </div>
  </div>

  <!-- La table : qui tient quel camp, et de quoi s'y asseoir ou en partir. Tout ce qui ne tient
       pas dans la barre est ici — c'est le motif du dialogue de correction de la carte. -->
  <dialog id="table-dialogue">
    <p id="table-titre"></p>
    <div id="table-places"></div>
    <div id="table-pied">
      <button type="button" id="table-contre-ia" hidden>Nouvelle partie contre l'IA</button>
      <button type="button" id="table-quitter" hidden>Quitter ma place</button>
      <button type="button" id="table-deconnexion">Se déconnecter</button>
      <button type="button" id="table-fermer">Fermer</button>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='geometrie.js') }}"></script>
  <script src="{{ url_for('static', filename='zoom.js') }}"></script>
  <script src="{{ url_for('static', filename='carte.js') }}"></script>
</body>
</html>
