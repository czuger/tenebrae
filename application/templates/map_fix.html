<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ave Tenebrae — corriger la carte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='zoom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='map_fix.css') }}">
</head>
<body>
  <!-- Toute la carte part d'un coup dans ces champs cachés : le survol n'interroge jamais le
       serveur, seule une correction lui est envoyée. -->
  <input type="hidden" id="hexagones" value="{{ carte }}">
  <input type="hidden" id="corrections" value="{{ corrections }}">
  <!-- Celles que le moteur a fusionnées à son démarrage : le jeu ne connaît que celles-là. -->
  <input type="hidden" id="appliquees" value="{{ appliquees }}">
  <input type="hidden" id="terrains" value="{{ terrains }}">
  <input type="hidden" id="grille" value="{{ grille }}">

  <div id="cadre">
    <div id="toile">
      <div id="plateau">
        <img id="carte" src="{{ url_for('image_de_la_carte') }}" alt="Carte d'Ave Tenebrae">
        <!-- Le surlignage de l'hexagone visé et la marque des cases déjà corrigées. -->
        <svg id="surlignage" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>

  <div id="outils">
    <button type="button" id="dezoomer" title="Reculer">−</button>
    <span id="echelle">—</span>
    <button type="button" id="zoomer" title="Approcher">+</button>
    <button type="button" id="ajuster">ajuster</button>
    <span id="compteur">aucune correction</span>
    <span id="redemarrage" hidden>redémarrer le serveur pour jouer dessus</span>
  </div>

  <div id="infobulle" hidden></div>

  <dialog id="choix">
    <p id="choix-titre"></p>
    <p id="choix-etat"></p>
    <div id="choix-terrains"></div>
    <div id="choix-pied">
      <button type="button" id="choix-retablir" hidden></button>
      <button type="button" id="choix-annuler">Annuler</button>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='geometrie.js') }}"></script>
  <script src="{{ url_for('static', filename='zoom.js') }}"></script>
  <script src="{{ url_for('static', filename='map_fix.js') }}"></script>
</body>
</html>
