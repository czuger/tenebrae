<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ave Tenebrae — corriger la carte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='zoom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='map_fix.css') }}">
</head>
<body>
  <!-- The whole map goes out at once in these hidden fields: hovering never queries the server,
       only a fix is sent to it. -->
  <input type="hidden" id="hexagons" value="{{ map }}">
  <input type="hidden" id="fixes" value="{{ fixes }}">
  <!-- Those the engine merged at start-up: the game knows only these. -->
  <input type="hidden" id="applied" value="{{ applied }}">
  <input type="hidden" id="terrains" value="{{ terrains }}">
  <input type="hidden" id="grid" value="{{ grid }}">

  <div id="frame">
    <div id="canvas">
      <div id="board">
        <img id="map" src="{{ url_for('game.map_image') }}" alt="Carte d'Ave Tenebrae">
        <!-- The highlight of the aimed hexagon and the mark of already fixed squares. -->
        <svg id="highlight" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button type="button" id="zoom-out" title="Reculer">−</button>
    <span id="scale">—</span>
    <button type="button" id="zoom-in" title="Approcher">+</button>
    <button type="button" id="fit">ajuster</button>
    <span id="counter">aucune correction</span>
    <span id="restart" hidden>redémarrer le serveur pour jouer dessus</span>
  </div>

  <div id="tooltip" hidden></div>

  <dialog id="choice">
    <p id="choice-title"></p>
    <p id="choice-state"></p>
    <div id="choice-terrains"></div>
    <div id="choice-footer">
      <button type="button" id="choice-reset" hidden></button>
      <button type="button" id="choice-cancel">Annuler</button>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='geometry.js') }}"></script>
  <script src="{{ url_for('static', filename='zoom.js') }}"></script>
  <script src="{{ url_for('static', filename='map_fix.js') }}"></script>
</body>
</html>
