<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ave Tenebrae — la carte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='zoom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='pieces.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">
</head>
<body>
  <!-- The server passes the layout and the grid alignment as JSON; the JavaScript uses them to
       convert cube coordinates into pixels and place the pieces. -->
  <input type="hidden" id="pieces" value="{{ pieces }}">
  <input type="hidden" id="grid" value="{{ grid }}">
  <input type="hidden" id="phase" value="{{ phase }}">
  <!-- Who is watching, who holds which side - and the game's version number, by which the browser
       sees that the opponent has played (see the "/game/state" route). -->
  <input type="hidden" id="table" value="{{ table }}">
  <input type="hidden" id="version" value="{{ version }}">
  <!-- Which saved game this page was served for. The server plays one game at a time and several
       have an address: when what the stream pushes carries another identifier, this page is
       watching a board that is no longer its own and says so (see #displaced). -->
  <input type="hidden" id="game" value="{{ game }}">
  <!-- The game log as it stands when the page opens; the rest arrives through the stream, with
       the pieces and the phase. -->
  <input type="hidden" id="initial-log" value="{{ log }}">
  <!-- Where this player was on the map: their scale and the point they had at the centre. "null"
       for an anonymous visitor, or for someone who has adjusted nothing yet - the map then opens
       fitted to the window. -->
  <input type="hidden" id="view" value="{{ view }}">

  <div id="frame">
    <div id="canvas">
      <div id="board">
        <img id="map" src="{{ url_for('images.map_image') }}" alt="Carte d'Ave Tenebrae">
      </div>
    </div>
  </div>

  <!-- The panel: the toolbar, and beneath it the card of the hovered unit. Both are outside
       #board, so they escape the zoom. It hangs from the top left corner of the window, or from
       the top right one - the first button of the bar sends it from one to the other, and the
       whole block goes with it (see #panel.right in map.css). -->
  <div id="panel">
    <div id="toolbar">
      <!-- Sends the whole panel to the other edge of the window - the bar, the card, the message
           and the log with it. The block lies over the map, and wherever it sits it covers pieces;
           two edges and nothing between them, hence a single button, which shows the edge it would
           go to. It comes first in the bar because the bar is clipped on the right: the handle of
           the block must not be what disappears. -->
      <button type="button" id="panel-side" title="Déplacer le panneau à droite">→</button>

      <!-- The face the pawns show: the counters photographed, or an icon per kind of unit in the
           colour of its army (see static/pawns.js). Two faces and nothing between them, hence a
           single button - which keeps its sign rather than swapping it, the bar being held to its
           reference size and a second glyph not being held to the width of the first. What it
           says is in "aria-pressed" and in the tooltip. It sits beside the button that moves the
           panel because it is of the same kind: a choice of display, this browser's alone, which
           the clipping on the right must not reach. -->
      <button type="button" id="pawn-style" aria-pressed="false"
              title="Afficher les pions en icônes">♟&#xFE0E;</button>

      <button type="button" id="zoom-out" title="Reculer">−</button>
      <span id="scale">—</span>
      <button type="button" id="zoom-in" title="Approcher">+</button>
      <button type="button" id="fit">ajuster</button>
      <!-- Brings the last clicked piece back to the centre of the window. As long as no piece has
           been clicked there is nothing to aim at: the button stays off. -->
      <button type="button" id="locate" title="Centrer sur le dernier pion cliqué" disabled>
        localiser
      </button>

      <!-- The current phase and its progress, in line with the zoom buttons. -->
      <span id="phase-label"></span>
      <button type="button" id="next-phase">Phase suivante</button>
      <button type="button" id="attack" hidden>Attaquer</button>
      <button type="button" id="cancel-combat" hidden>Annuler</button>

      <!-- The player: a single button, whatever the state. Anonymous, it sends to Discord;
           connected, it opens the table dialog. Nothing else goes into the bar - its reference
           size is documented in map.css, and one more addition would make it overflow to the
           right. What the bar takes is a sign, like the one that moves the panel: a word would
           cost the room this button needs. -->
      <button type="button" id="player"></button>
    </div>

    <!-- What the server refused - playing out of turn, without a seat, without an account. Under
         the bar like the card: the panel grows downwards, the bar does not move. -->
    <div id="message" hidden></div>

    <!-- Said once and left there: another game has been opened on the server, so this page no
         longer follows its own. Not #message, which fades - this one does not go away, because
         nothing on the page is true any more. -->
    <div id="displaced" hidden></div>

    <!-- The card of the hovered unit, under the bar rather than following it: inside the bar it
         had to stay tiny so as not to lengthen it. The JavaScript fills it from what the hidden
         "pieces" field carries.

         It is **always there**, empty as long as nothing is hovered: the area is the player's, and
         reserving it stops the panel - and the log column below it - from jumping at every pointer
         movement over the map. Empty, it is not blank: "card-extra" then carries the coordinates
         of the square under the pointer, on the line where a hovered piece shows its own. -->
    <div id="card" class="empty">
      <img id="card-image" alt="">
      <div id="card-text">
        <span id="card-name"></span>
        <span id="card-extra"></span>
        <span id="card-symbol"></span>
        <dl id="card-values"></dl>
        <span id="card-remarks"></span>
      </div>
    </div>

    <!-- The game log, in a column under the card: phase changes, combats declared and resolved,
         AI moves. It is the same account as `battle_log.log`, whose last lines the server keeps
         in memory to push them with the game. Empty, the column does not appear - as long as the
         player has not used its button.

         The "−" button reduces it to itself, and brings it back: the column is tall, it lies over
         the map, and one does not always want to read it. It is the second thing in the page to
         take the pointer back from the panel (see map.css) - it carries a button, like the bar. -->
    <div id="log" hidden>
      <button type="button" id="log-toggle" title="Réduire le journal"
              aria-controls="log-lines" aria-expanded="true">−</button>
      <ol id="log-lines"></ol>
    </div>
  </div>

  <!-- The table: who holds which side, and the means to sit down or leave. Everything that does
       not fit in the bar is here - that is the pattern of the map-fixing dialog. -->
  <dialog id="table-dialog">
    <p id="table-title"></p>
    <div id="table-seats"></div>

    <!-- No scenario chooser and no "contre l'IA" here any more: a game is opened on the landing
         page, which is where one picks the set-up and the side one takes. What is left is what
         belongs to the game one is at - its seats - and the way back to the list. -->
    <div id="table-footer">
      <button type="button" id="table-games">Les parties</button>
      <button type="button" id="table-leave" hidden>Quitter ma place</button>
      <button type="button" id="table-logout">Se déconnecter</button>
      <button type="button" id="table-close">Fermer</button>
    </div>
  </dialog>

  <!-- First, before every other script: the others take a logger of their own from it as they
       load. Silent unless it is turned on - "?debug=1", or `tenebraeDebug.on()`. -->
  <script src="{{ url_for('static', filename='debug.js') }}"></script>
  <script src="{{ url_for('static', filename='geometry.js') }}"></script>
  <script src="{{ url_for('static', filename='zoom.js') }}"></script>
  <script src="{{ url_for('static', filename='pieces.js') }}"></script>
  <script src="{{ url_for('static', filename='pawns.js') }}"></script>
  <script src="{{ url_for('static', filename='map.js') }}"></script>
</body>
</html>
